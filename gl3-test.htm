<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gimme Light!</title>
    <style>
        :root {
            --bg-color: #08140e;
            --panel-bg: #102319;
            --wire-off: #546e7a;
            --wire-on: #f1c40f;
            --wire-short: #e74c3c;
            --grid-line: rgba(190, 224, 198, 0.12);
        }

        * { box-sizing: border-box; }

        body {
            background-color: var(--bg-color);
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100dvh;
            margin: 0;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
            padding-left: 10px;
            padding-right: 10px;
        }

        #game-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 800px;
            height: 100%;
            max-height: 100%;
        }

        #game-header-stats {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            padding-bottom: 0px; 
            margin-bottom: 5px; 
            font-size: 2rem; 
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            z-index: 10;
            flex-shrink: 0;
            cursor: pointer; 
            transition: color 0.2s;
        }
        
        @keyframes shake-trigger {
            0% { transform: translate(1px, 1px) rotate(0deg); color: #e74c3c; }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(3px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(1px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }

        .reset-charging {
            animation: shake-trigger 0.5s infinite;
        }

        .level-label { color: #bdc3c7; font-size: inherit; pointer-events: none; }
        .level-val { color: var(--wire-on); font-size: inherit; pointer-events: none; }

        #game-container {
            position: relative;
            background: var(--panel-bg);
            border-radius: 12px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            border: 4px solid #294536;
            padding: 15px;
            transition: width 0.2s, height 0.2s;
            margin: 0 auto; 
            flex-shrink: 1; 
        }
        
        #game-container::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 8px;
            box-shadow: inset 0 0 40px rgba(0,0,0,0.8);
            pointer-events: none;
            z-index: 20;
        }

        #game-stage { position: relative; }

        #glow-layer {
            position: absolute; inset: 0; pointer-events: none; z-index: 0;
            opacity: 0.6; transition: opacity 0.66s ease-out; mix-blend-mode: normal;
        }

        #grid-lines {
            position: absolute; inset: 0; pointer-events: none; z-index: 1;
            background-image: 
                linear-gradient(var(--grid-line) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        #fx-canvas { position: absolute; inset: 0; pointer-events: none; z-index: 15; }

        #grid { 
            display: grid; gap: 0; position: relative; z-index: 5;
        }

        .cell { position: relative; cursor: pointer; -webkit-tap-highlight-color: transparent; }
        .cell svg { display: block; overflow: visible; width: 100%; height: 100%; }

        .tile-inner {
            width: 100%; height: 100%;
            transition: transform 0.15s ease-out; 
            pointer-events: none; 
        }

        path, rect, circle, line { transition: stroke 0.1s, filter 0.1s, fill 0.1s; }

        .wire-bg { 
            fill: none; stroke: var(--panel-bg); stroke-width: 24; stroke-linecap: butt;
        }
        .wire-path { 
            fill: none; stroke: var(--wire-off); stroke-width: 12; stroke-linecap: round; 
        }
        .cap-butt { stroke-linecap: butt; }

        /* Цвета проводов */
        .pg-0 .wire-group-0 { stroke: var(--wire-on); filter: drop-shadow(0 0 5px var(--wire-on)); }
        .pg-1 .wire-group-1 { stroke: var(--wire-on); filter: drop-shadow(0 0 5px var(--wire-on)); }
        
        .sc-0 .wire-group-0 { stroke: var(--wire-short) !important; filter: drop-shadow(0 0 8px var(--wire-short)) !important; }
        .sc-1 .wire-group-1 { stroke: var(--wire-short) !important; filter: drop-shadow(0 0 8px var(--wire-short)) !important; }

        .pg-0 .wire-group-0.cycle-wire, .pg-1 .wire-group-1.cycle-wire {
            stroke:#ef9050; filter:drop-shadow(0 0 4px #ed703b99);
        }
        @keyframes flow { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -25; } }

        /* Анимация включенных проводов */
        .level-complete .pg-0 .wire-group-0 { stroke-dasharray: 20 5; animation: flow 0.5s linear infinite; animation-direction: normal; }
        .level-complete .pg-1 .wire-group-1 { stroke-dasharray: 20 5; animation: flow 0.5s linear infinite; animation-direction: normal; }

        /* 
           УНИВЕРСАЛЬНАЯ ЛОГИКА НАПРАВЛЕНИЯ:
           Теперь мы используем JS, чтобы повесить класс 'reverse-flow' на конкретный DOM-элемент (путь),
           если ток течет против направления рисования SVG.
        */
        .level-complete .wire-path.reverse-flow {
            animation-direction: reverse !important;
        }

        .bat-case { fill: #555; stroke: #999; stroke-width: 2; }
        .bat-tip { fill: #888; stroke: none; }
        .bat-icon { fill: #222; stroke: none; }
        .pg-0 .bat-case { fill: #ddd; stroke: #fff; filter: drop-shadow(0 0 10px white); }
        .pg-0 .bat-tip { fill: #fff; }
        .pg-0 .bat-icon { fill: #f1c40f; }
        .sc-0 .bat-case { fill: #500; stroke: #f00; filter: drop-shadow(0 0 15px red); }
        .sc-0 .bat-icon { fill: #f00; }
        .sc-0 .bat-tip { fill:#e74c3c; }

        .bulb-glass { 
            fill: rgba(180, 200, 210, 0.15); 
            stroke: #cfd8dc; 
            stroke-width: 4; 
            filter: drop-shadow(0 0 4px rgba(0,0,0,0.8)); 
        }
        .bulb-cap { fill: #555; stroke: #222; stroke-width: 1; } 
        .bulb-filament { stroke: #555; stroke-width: 2; fill: none; }

        @keyframes glowPulse { 0%, 100% { filter: drop-shadow(0 0 7px var(--bulb-color)); fill-opacity: 0.86; } 50% { filter: drop-shadow(0 0 18px var(--bulb-color)); fill-opacity: 1; } }
        @keyframes partyBlink {
            0%,100% { filter:drop-shadow(0 0 12px var(--bulb-color)) saturate(1) brightness(var(--wave-min,.7)); fill-opacity:.82; }
            50% { filter:drop-shadow(0 0 23.4px var(--bulb-color)) saturate(var(--wave-peak,1.3)) brightness(var(--wave-lamp-peak,1)); fill-opacity:1; }
        }
        @keyframes victoryAura {
            0%,100% { filter:saturate(1) brightness(var(--wave-min,.7)); }
            50% { filter:saturate(var(--wave-peak,1.3)) brightness(var(--wave-peak,1.3)); }
        }

        .pg-0 .bulb-glass, .pg-1 .bulb-glass { 
            fill: var(--bulb-color); stroke: #fff; stroke-width: 2.5; 
            animation: glowPulse 2.5s ease-in-out infinite; 
            animation-delay:0s;
            filter:drop-shadow(0 0 7px var(--bulb-color)); fill-opacity:.86; 
        }
        .pg-0 .bulb-filament, .pg-1 .bulb-filament { stroke: #fff; stroke-width: 2; }
        
        .sc-0 .bulb-glass { fill: #300; stroke: #500; }
        .level-complete .pg-0 .bulb-glass, .level-complete .pg-1 .bulb-glass { 
            animation: partyBlink 2.8s ease-in-out infinite; animation-delay:var(--wave-delay,0s); 
        }

        #overlay {
            width:100%; height:52px; min-height:52px; flex-shrink:0; margin-top:8px;
            display:flex; align-items:center; justify-content:center;
            opacity:0; visibility:hidden; pointer-events:none;
            transform:translateY(5px); transition:opacity 1s ease-in-out,transform 1s ease-in-out,visibility 1s;
        }
        #overlay.visible { opacity:1; visibility:visible; pointer-events:auto; transform:translateY(0); }
        #overlay button {
            background:linear-gradient(135deg,#39d789,#18ac68); color:white;
            border:1px solid #92f1c0; border-radius:25px; padding:11px 30px;
            font-size:17px; font-weight:bold; cursor:pointer;
            box-shadow:0 4px 18px #23c87855; transition:transform .12s,box-shadow .2s;
        }
        #overlay button:hover { box-shadow:0 4px 24px #23c87888; }
        #overlay button:active { transform:scale(.96); }
        #level-title {
            position:relative; display:inline-flex; align-items:center; justify-content:center; gap:8px;
            transform:translateX(0); transition:transform 1s ease-in-out;
        }
        #level-title.completed { transform:translateX(calc(-.5em - 4px)); }
        #level-complete-mark {
            position:absolute; left:calc(100% + 8px); top:0; width:1em;
            color:#51e39a; opacity:0; white-space:nowrap; text-align:center;
            pointer-events:none; transition:opacity 1s ease-in-out;
        }
        #level-complete-mark.visible { opacity:1; }
        #glow-layer { overflow:hidden; }
        .bulb-light { position:absolute; pointer-events:none; }
        #game-stage.level-complete .bulb-light {
            animation:victoryAura 2.8s ease-in-out infinite;
            animation-delay:var(--wave-delay,0s);
        }

        @keyframes popIn { 0% { transform: scale(0); } 100% { transform: scale(1); } }
        .cell { animation: popIn 0.3s backwards; }
        @keyframes shake { 0%, 100% { transform: translate(0,0); } 25% { transform: translate(-2px, 2px); } 75% { transform: translate(2px, -2px); } }
        .shaking { animation: shake 0.4s; }

        @media (max-width: 600px) {
            #game-container { padding: 10px; }
            #game-header-stats { font-size: 1.5rem; margin-bottom: 5px; }
        }
        html, body { overflow:hidden; overscroll-behavior:none; }
        body { height:var(--viewport-height,100dvh); align-items:center; justify-content:center; }
        #game-wrapper { margin:0 auto; width:100%; min-width:0; max-width:1000px; min-height:0; height:100%; flex-shrink:0; }
        #game-container { flex-shrink:0; }
        #grid-lines { display:none; }
        .active-cell { box-shadow:inset 0 0 0 1px var(--grid-line); background:rgba(166,220,181,.03); }
        /* A translucent shade attenuates the light layer beneath empty cells. */
        .cell.void { visibility:visible; pointer-events:none; background:rgba(0,0,0,.24); }
        .cell.void .tile-inner { visibility:hidden; }
        .wrap-edge { position:absolute; z-index:8; pointer-events:none; background:#56d9e8; opacity:.85; }
        .wrap-edge.left,.wrap-edge.right { width:3px; height:22%; top:39%; }
        .wrap-edge.top,.wrap-edge.bottom { height:3px; width:22%; left:39%; }
        .wrap-edge.left { left:0; } .wrap-edge.right { right:0; }
        .wrap-edge.top { top:0; } .wrap-edge.bottom { bottom:0; }
        .pannable { cursor:grab; }
        .pannable.panning { cursor:grabbing; }
        .panning #grid, .panning #glow-layer, .panning #fx-canvas { visibility:hidden; }
        /* Explicitly hide holes: their visibility:visible overrides the hidden grid. */
        .panning #grid .cell { visibility:hidden !important; }
        .panning #glow-layer { opacity:0 !important; transition:none; }
        .pan-layer { position:absolute; inset:0; overflow:hidden; z-index:6; pointer-events:none;
            box-shadow:inset 0 0 20px #56d9e822; }

        .no-pop .cell { animation:none; }
        /* Freeze effects in the visible field copies until snapping ends. */
        #game-stage.panning *, .page-hidden * { animation-play-state:paused !important; }

        #game-container { transition:none; }
        #game-header-stats { flex-wrap:nowrap; gap:0; line-height:1.15; }
        @media (max-height:450px), (max-width:280px) {
            body { padding-left:4px; padding-right:4px; }
            #game-container { padding:4px; border-width:2px; }
            #game-header-stats, .cheat-mode #game-header-stats { font-size:16px; margin-bottom:3px; }
            #debug-btn { margin-top:4px; gap:6px; }
            .dbg { min-height:28px; padding:4px 10px; font-size:11px; }
            #cheat-badge { font-size:9px; padding:1px 6px; margin-bottom:3px; letter-spacing:0; }
            #overlay { height:38px; min-height:38px; margin-top:4px; }
            #overlay button, .cheat-mode #overlay button { padding:7px 20px; font-size:14px; }
        }
        [hidden] { display:none !important; }
        .wrap-edge.edge-powered { background:var(--wire-on); }
        @media (prefers-reduced-motion:reduce) {
            #game-stage.level-complete .bulb-light,.level-complete .bulb-glass { animation:none !important; }
            #overlay { transition:none; }
        }
        /* Small feedback details; the board geometry and palette stay the same. */
        .cell.void { box-shadow:inset 0 1px 3px #0004; }
        .cell::after { content:''; position:absolute; inset:1px; pointer-events:none;
            border:1px solid #eaf8ff; border-radius:2px; opacity:0; }
        @keyframes cellTap { from { opacity:.85; } to { opacity:0; } }
        .cell.tapped::after { animation:cellTap .18s ease-out; }
        .bat-icon { stroke:#38424b; stroke-width:1; stroke-linejoin:round; }
        .pg-0 .bat-icon { fill:#edbd32; }
        #game-stage::before { content:''; position:absolute; inset:0; pointer-events:none;
            z-index:18; border:0 solid #67dce599; opacity:0; }
        #game-stage.panning::before { opacity:1; }
        #game-stage.panning.wrap-x::before { border-left-width:2px; border-right-width:2px; }
        #game-stage.panning.wrap-y::before { border-top-width:2px; border-bottom-width:2px; }
        @keyframes faultFlash { from { background:#ff554422; } to { background:transparent; } }
        #game-container.fault-flash::after { animation:faultFlash .25s ease-out; }
        @keyframes shake { 0%,100% { transform:translate(0,0); }
            35% { transform:translate(-1px,0); } 70% { transform:translate(1px,0); } }
        .shaking { animation:shake .18s ease-out; }
        @media (prefers-reduced-motion:reduce) {
            .tapped::after,#game-container.fault-flash::after,.shaking { animation:none !important; }
        }
        @keyframes nextInvite {
            0%,100% { background-position:0% 50%; }
            50% { background-position:100% 50%; }
        }
        #overlay button {
            background-image:linear-gradient(110deg,#15965b 0%,#27c47a 28%,#60dfa0 50%,#2ec985 72%,#149761 100%);
            background-size:250% 100%; background-position:0% 50%;
        }
        #overlay.visible button { animation:nextInvite 5s ease-in-out infinite; }
        #overlay.visible button:active { animation:none; transform:scale(.96); }
        @media (prefers-reduced-motion:reduce) {
            #overlay.visible button { animation:none; }
            #glow-layer { transition:none; }
        }
        @media (prefers-reduced-motion:reduce) { #level-title,#level-complete-mark { transition:none; } }
        .panning.pan-live #grid,.panning.pan-live #grid .cell {visibility:visible !important;}
        .panning.pan-live #grid {overflow:hidden;}
        .panning.pan-live .wrap-edge,.panning.pan-live .cell::after {display:none;}
        .panning.pan-live .wire-path {stroke-dasharray:none !important;}
        .panning.pan-live svg * {filter:none !important;transition:none !important;}
        #debug-btn {
            display: flex;
            justify-content: center;
            gap: 10px; margin-top: 10px; flex-shrink: 0;
            position: relative; z-index: 100;
        }
        .dbg {
            background: #34495e; color: #bdc3c7; font-size: 0.8rem; padding: 8px 12px;
            border: 1px solid #555; min-height: 44px; border-radius: 4px; cursor: pointer;
        }
        .dbg:hover { opacity: 1; }

        #cheat-badge { color:#ecb9ff; background:#61277b44; border:1px solid #b868db;
            border-radius:20px; padding:3px 12px; margin-bottom:5px; font-size:11px; letter-spacing:1px; }
        .cheat-mode #game-header-stats { font-size:clamp(18px,5vw,30px); cursor:default; }
        .cheat-mode .level-label,.cheat-mode .level-val { color:#d993ff; }
        .cheat-mode #game-container { border-color:#9756b4; }
        .cheat-mode #overlay button { font-size:1rem; padding:15px 20px; }
        #game-container { transition:none; }
        #game-header-stats { flex-wrap:nowrap; gap:0; line-height:1.15; }
        #cheat-badge { max-width:100%; text-align:center; flex-shrink:0; }
    </style>
</head>
<body>

    <div id="game-wrapper">
        <div id="game-header-stats">
            <span id="level-title">
                <span class="level-label" id="level-label">Level:</span>
                <span class="level-val" id="level-display">1</span>
                <span id="level-complete-mark" aria-label="Level completed" aria-hidden="true">✓</span>
            </span>
        </div>

        <div id="cheat-badge" hidden>SANDBOX * PROGRESS NOT SAVED</div>
        <div id="game-container">
            <div id="game-stage">
                <div id="glow-layer"></div>
                <div id="grid-lines"></div>
                <div id="grid"></div>
                <canvas id="fx-canvas"></canvas>


            </div>
        </div>
        <div id="overlay">
            <button id="next-button" onclick="window.game.nextLevel()">Next Level →</button>
        </div>
        <div id="debug-btn" hidden>
            <button type="button" class="dbg" onclick="window.game.resolve()">Resolve</button>
            <button type="button" class="dbg" onclick="window.game.nextLevel()">Skip</button>
            <button type="button" class="dbg" onclick="window.game.exitSandbox()">Exit debug</button>
        </div>
    </div>

<script>
/** CONSTANTS */
const TILES = { EMPTY:0, LINE:1, CORNER:2, TEE:3, CROSS:4, BULB:5, BATTERY:6, BRIDGE:7, D_CORNER:8 };
const DX = [0, 1, 0, -1];
const DY = [-1, 0, 1, 0];

const TILE_CONNS = {
    [TILES.EMPTY]:   [0,0,0,0], [TILES.LINE]:    [1,0,1,0], [TILES.CORNER]:  [1,1,0,0],
    [TILES.TEE]:     [0,1,1,1], [TILES.CROSS]:   [1,1,1,1], [TILES.BULB]:    [0,0,1,0],
    [TILES.BATTERY]: [1,0,0,0], [TILES.BRIDGE]:  [1,1,1,1], [TILES.D_CORNER]:[1,1,1,1]
};

const GENERATION_VERSION = 3;
const MAX_FIELD_SIDE = 16; // Fixed for all players; rendering scales to the viewport.
function levelRandom(level, domain='wires') {
    let seed=2166136261;
    for(const char of `gimme-light-v3:${GENERATION_VERSION}:${level}:${domain}`)
        seed=Math.imul(seed^char.charCodeAt(0),16777619)>>>0;
    return ()=>{
        seed=(seed+0x6D2B79F5)>>>0;
        let t=seed;
        t=Math.imul(t^(t>>>15),t|1);
        t^=t+Math.imul(t^(t>>>7),t|61);
        return ((t^(t>>>14))>>>0)/4294967296;
    };
}
// Eight coordinated, slightly softened hues; canonical order is part of generation v3.
const BULB_COLORS = ['#ed626e','#f29b50','#efd054','#62c681','#53c4dc','#608fe5','#aa7bdd','#e8ebf2'];
// Render existing v3 saves with the updated palette without changing their puzzle state.
const PREVIOUS_BULB_COLORS = ['#e67c83','#eba56f','#e6ce79','#87c995','#80cbd7','#829fe0','#b398d9','#e5e7ed'];
function displayBulbColor(color) {
    const index=PREVIOUS_BULB_COLORS.indexOf(color);
    return index<0 ? color : BULB_COLORS[index];
}
function shuffle(items,random) {
    for(let i=items.length-1;i>0;i--) {
        const j=Math.floor(random()*(i+1));[items[i],items[j]]=[items[j],items[i]];
    }
    return items;
}
function levelVariety(level) {
    const random=levelRandom(level,'variety');
    const population=random(), branching=random();
    const density=population<0.30 ? (0.004+random()*0.014) :
        population<0.70 ? (0.025+random()*0.055) : (0.12+random()*0.10);
    const branchChance=branching<0.30 ? 0.005+random()*0.025 :
        branching<0.70 ? 0.10+random()*0.25 : 0.60+random()*0.30;
    // Rest levels remain possible after the difficulty budget reaches its ceiling.
    const relax=level>=60 && random()<0.32;
    let maxW=MAX_FIELD_SIDE,maxH=MAX_FIELD_SIDE;
    if(relax) {
        const axis=Math.floor(random()*3);
        if(axis!==1) maxW=8+Math.floor(random()*5);
        if(axis!==0) maxH=8+Math.floor(random()*5);
    }
    return {density,branchChance,relax,maxW,maxH};
}
function batteryCount(level,active) {
    const random=levelRandom(level,'batteries');
    return Math.max(1,Math.min(Math.floor(active/4),Math.round(active*levelVariety(level).density*(0.8+random()*0.4))));
}
function bulbBag(level,count) {
    const random=levelRandom(level,'palette');
    const palette=shuffle(BULB_COLORS.slice(),random).slice(0,Math.min(count,1+Math.floor(random()*8)));
    const colors=[];
    while(colors.length<count) colors.push(...shuffle(palette.slice(),random));
    return colors.slice(0,count);
}


function cheatLevelFromURL(search) {
    const raw=new URLSearchParams(search).get('level');
    if(!raw || !/^[0-9]+$/.test(raw)) return null;
    const level=Number(raw);
    return Number.isSafeInteger(level) && level>=1 ? level : null;
}

/** Field templates from Field.java. A torus wraps both axes; a ring wraps one. */
function fieldSpec(level) {
    // Candidate shapes repeat; sieves are deferred until their pattern fits the budget and screen.
    const index = (level - 1) % 9, cycle = Math.floor((level - 1) / 9);
    let template = [0,1,2,6,3,4,5,7,0][index];
    // Introduce each wrapping mechanic explicitly, then keep the existing rotation.
    if(level===30) return {template:7,wrapX:true,wrapY:false,spacing:2+cycle%4};
    if(level===50) return {template:0,wrapX:true,wrapY:true,spacing:2+cycle%4};
    if(level<30 && template===7) template=0;
    const torus = level>=50 && (index===8 || (cycle%2===1 && template>0 && template!==7));
    const ringRandom=levelRandom(level,'topology');

/** AUDIO */
class SoundSystem {
    constructor() { this.ctx = null; this.inited = false; }
    init() {
        if (!this.inited) {
            this.ctx = new (window.AudioContext || window.webkitAudioContext)();
            this.inited = true;
        }
        if(this.ctx.state === 'suspended') this.ctx.resume();
    }
    play(t) {
        if(!this.inited) return;
        const ctx = this.ctx, now = ctx.currentTime;
        
        if (t === 'win') {
            const notes = [523.25, 659.25, 783.99, 1046.50]; 
            notes.forEach((freq, i) => {
                const osc = ctx.createOscillator();
                const g = ctx.createGain();
                osc.connect(g); g.connect(ctx.destination);
                osc.type = 'triangle'; 
                const startTime = now + i * 0.08; 
                osc.frequency.setValueAtTime(freq, startTime);
                g.gain.setValueAtTime(0, startTime);
                g.gain.linearRampToValueAtTime(0.1, startTime + 0.02);
                g.gain.exponentialRampToValueAtTime(0.001, startTime + 0.3);
                osc.start(startTime);
                osc.stop(startTime + 0.3);
            });
            return;
        }

        const osc = ctx.createOscillator();
        const g = ctx.createGain();
        osc.connect(g); g.connect(ctx.destination);
        
        if(t==='rotate'){
            osc.type='triangle'; osc.frequency.setValueAtTime(400,now); 
            osc.frequency.exponentialRampToValueAtTime(100,now+0.05);
            g.gain.setValueAtTime(0.1,now); g.gain.exponentialRampToValueAtTime(0.01,now+0.05);
            osc.start(now); osc.stop(now+0.05);
        } else if(t==='zap'){
            osc.type='sawtooth'; osc.frequency.setValueAtTime(100,now);
            for(let i=0;i<10;i++) osc.frequency.linearRampToValueAtTime(100+Math.random()*100,now+i*0.03);
            g.gain.setValueAtTime(0.2,now); g.gain.linearRampToValueAtTime(0,now+0.3);
            osc.start(now); osc.stop(now+0.3);
        } else if(t==='on'){
            osc.type = 'sine'; osc.frequency.setValueAtTime(1200, now); 
            g.gain.setValueAtTime(0, now); g.gain.linearRampToValueAtTime(0.15, now + 0.01);
            g.gain.exponentialRampToValueAtTime(0.001, now + 0.4); 
            osc.start(now); osc.stop(now+0.4);
        }
    }
}

/** VFX */
class VisualFX {
    constructor() {
        this.canvas = document.getElementById('fx-canvas');
        this.ctx = this.canvas.getContext('2d');
        this.glowLayer = document.getElementById('glow-layer');
        this.lights = new Map();
        this.particles = [];
        this.loop = this.loop.bind(this);
        this.frame=null;
    }
    wake() {
        if(this.frame===null && this.particles.length && !document.hidden)
            this.frame=requestAnimationFrame(this.loop);
    }
    resize(w, h, cs) {
        if(this.canvas.width!==w) this.canvas.width=w;
        if(this.canvas.height!==h) this.canvas.height=h;
        this.cellSize=cs;
    }
    spawn(cx, cy, type, color) {
        const cnt = type==='zap'?3: (type==='win'?20:5);
        for(let i=0;i<cnt;i++){
            let a=Math.random()*6.28, s=1+Math.random()*4;
            this.particles.push({
                x:cx, y:cy, vx:Math.cos(a)*s, vy:Math.sin(a)*s, 
                life:1, decay:0.02+Math.random()*0.03, 
                color:color||'#fff', size:1+Math.random()*2, type:type
            });
        }
        this.wake();
    }
    updateLight(bulbs) {
        const active=new Set(bulbs);
        for(const [bulb,light] of this.lights) {
            if(!active.has(bulb)) { light.remove(); this.lights.delete(bulb); }
        }
        // Keep each local light separate so its victory phase matches its lamp.
        // Reuse nodes on repeated checks to avoid restarting their animations.
        const radius=this.cellSize*2.8;
        bulbs.forEach((b,index)=>{
            let light=this.lights.get(b);
            if(!light) {
                light=document.createElement('div');
                light.className='bulb-light';
                this.glowLayer.appendChild(light);
                this.lights.set(b,light);
            }
            const signature=[b.x,b.y,this.cellSize,b.color,index,bulbs.length].join(':');
            if(light.lightSignature===signature) return;
            light.lightSignature=signature;
            const color=displayBulbColor(b.color);
            light.style.left=((b.x+0.5)*this.cellSize-radius)+'px';
            light.style.top=((b.y+0.5)*this.cellSize-radius)+'px';
            light.style.width=light.style.height=(radius*2)+'px';
            light.style.zIndex=bulbs.length-index;
            // A diagonal wave with gently curved fronts, independent of wiring.
            // Coordinate-based variation stays deterministic and viewport-independent.
            const phase=b.x*.34+b.y*.23+.16*Math.sin(b.y*.8+b.x*.35);
            const variation=(Math.sin(b.x*12.9898+b.y*78.233)*43758.5453)%1;
            const amplitude=variation-Math.floor(variation);
            const peak=1.24+.12*amplitude;
            const wave={
                '--wave-delay':(-phase)+'s',
                '--wave-min':.72-.14*amplitude,
                '--wave-peak':peak,
                '--wave-lamp-peak':peak/1.3
            };
            for(const [name,value] of Object.entries(wave)) {
                b.el.style.setProperty(name,value);
                light.style.setProperty(name,value);
            }
            light.style.background=`radial-gradient(circle ${radius}px at center, ${color}a0 0%, ${color}60 38%, ${color}26 68%, ${color}00 100%)`;
        });
        this.glowLayer.style.opacity=bulbs.length ? 1 : 0;
    }
    loop() {
        this.frame=null;
        if(document.hidden) return;
        this.ctx.clearRect(0,0,this.canvas.width,this.canvas.height);
        for(let i=this.particles.length-1;i>=0;i--){
            let p=this.particles[i]; p.life-=p.decay; p.x+=p.vx; p.y+=p.vy;
            if(p.type!=='zap') p.vy+=0.1;
            if(p.life<=0) this.particles.splice(i,1);
            else {
                this.ctx.globalAlpha=p.life; this.ctx.fillStyle=p.color;
                this.ctx.beginPath(); this.ctx.arc(p.x,p.y,p.size,0,6.28); this.ctx.fill();
            }
        }
        this.wake();
    }
}

        const colors=bulbBag(level,map.flat().filter(c=>c.type===TILES.BULB).length);
        let colorIndex=0;
        let res=[];
        for(let y=0;y<h;y++){
            let r=[];
            for(let x=0;x<w;x++){
                let c=map[y][x];
                let col=null;
                if(c.type===TILES.BULB) col=colors[colorIndex++];
                let correctRot = 0;
                if (c.type === TILES.BRIDGE) {
                    if (c.bridgeDir !== undefined) correctRot = this.solveBridgeRot(c.bridgeDir);
                } else if (c.type === TILES.D_CORNER) {
                    if (c.dCornerPair) correctRot = this.solveDCornerRot(c.dCornerPair);
                } else if (c.type !== TILES.BATTERY) {
                     correctRot = this.getCorrectRotation(c.type, c.mask);
                } else {
                     let dir = 0; for(let i=0;i<4;i++) if(c.mask&(1<<i)) dir=i;
                     correctRot = dir;
                }
                r.push({ type: c.type, rot: Math.floor(random()*4), correctRot: correctRot, color: col, blocked: !mask[y][x] });
            }
            res.push(r);
        }
        return res;
    }
}

/** GAME ENGINE */
class Game {
    constructor() {
        this.el=document.getElementById('grid');
        this.gridLines=document.getElementById('grid-lines');
        this.ov=document.getElementById('overlay');
        this.cnt=document.getElementById('game-container');
        this.stage = document.getElementById('game-stage');
        this.gen=new LevelGenerator();
        this.audio = new SoundSystem();
        this.vfx = new VisualFX();
        this.inputLocked = false;
        
        this.STORAGE_KEY = 'gimme_light_v3_save';
        this.SAVE_VERSION = 1;
        this.cheatMode=false;
        this.debugMode=new URLSearchParams(window.location.search).get('debug')==='1';

        this.initResetHandler();
        this.initPanHandler();
        const resize=()=>{
            if(this.resizeFrame!=null) return;
            this.resizeFrame=requestAnimationFrame(()=>{
                this.resizeFrame=null;
                if(this.pan || this.panSettling) {this.resizePending=true;return;}
                this.setupLayout();this.check(true);
            });
        };
        document.addEventListener?.('visibilitychange',()=>{
            document.body.classList.toggle('page-hidden',document.hidden);
            if(document.hidden) {
                cancelAnimationFrame(this.vfx.frame);this.vfx.frame=null;
            } else this.vfx.wake();
        });
        window.addEventListener('resize',resize);
        window.visualViewport?.addEventListener('resize',resize);

        const cheatLevel=cheatLevelFromURL(window.location.search);
        if(cheatLevel!==null) {
            this.cheatMode=true;
            this.lvl=cheatLevel;
            this.start();
        } else if (!this.loadProgress()) {
            this.lvl=1; 
            this.start();
        }
    }

    get sandboxMode() { return this.cheatMode || this.debugMode; }

    updateModeUI() {
        document.getElementById('debug-btn').hidden=!this.debugMode;
        document.body.classList.toggle('cheat-mode',this.sandboxMode);
        document.getElementById('level-display').textContent=this.lvl;
        document.getElementById('level-label').textContent=this.debugMode ? 'Debug level:' : this.cheatMode ? 'Cheat level:' : 'Level:';
        document.getElementById('cheat-badge').hidden=!this.sandboxMode;
        document.getElementById('next-button').textContent=this.cheatMode && !this.debugMode ? 'Return to progress' : 'Next Level →';
    }

    initPanHandler() {
        this.stage.addEventListener('pointerdown', e => {
            if(!e.isPrimary || e.button!==0 || this.transitionBusy || this.panSettling ||
                !(this.spec.wrapX || this.spec.wrapY) || e.target.closest('#overlay')) return;
            this.pan={id:e.pointerId, x:e.clientX, y:e.clientY, dx:0, dy:0, dragging:false};
        });
        this.stage.addEventListener('pointermove', e => {
            const p=this.pan;
            if(!p || p.id!==e.pointerId) return;
            p.dx=this.spec.wrapX ? e.clientX-p.x : 0;
            p.dy=this.spec.wrapY ? e.clientY-p.y : 0;
            if(!p.dragging && Math.hypot(p.dx,p.dy)<8) return;
            if(!p.dragging) {
                p.dragging=true;
                this.stage.setPointerCapture(e.pointerId);
                this.createPanLayer();
            }
            e.preventDefault();
            if(this.dragFrame==null) this.dragFrame=requestAnimationFrame(()=>{
                this.dragFrame=null;
                if(this.pan?.dragging) this.paintPan(this.pan.dx,this.pan.dy);
            });
        });
        const finish=e=>{
            const p=this.pan;
            if(!p || p.id!==e.pointerId) return;
            cancelAnimationFrame(this.dragFrame);this.dragFrame=null;
            this.pan=null;
            if(this.stage.hasPointerCapture(e.pointerId)) this.stage.releasePointerCapture(e.pointerId);
            if(p.dragging) {
                this.suppressClickUntil=performance.now()+400;
                this.settlePan(p.dx,p.dy);
            }
        };
        this.stage.addEventListener('pointerup',finish);
        this.stage.addEventListener('pointercancel',finish);
        this.stage.addEventListener('lostpointercapture',e=>{
            // Touch starts with implicit capture on the cell. Transferring capture to
            // the stage emits a bubbling loss event from that cell, not a finger release.
            if(e.target!==this.stage || this.stage.hasPointerCapture(e.pointerId)) return;
            finish(e);
        });
        this.stage.addEventListener('pointerleave',e=>{
            if(this.pan && !this.pan.dragging) this.pan=null;
        });
        this.stage.addEventListener('click', e=>{
            if(this.panSettling || performance.now()<(this.suppressClickUntil || 0)) {
                e.preventDefault();e.stopPropagation();
            }
        },true);
        window.addEventListener('blur',()=>this.cancelPan());
    }

    createPanLayer() {
        if(this.panBitmapVersion!==this.boardVersion && this.finishPanBitmap) this.finishPanBitmap();
        this.panUsingCanvas=!!this.panBitmap && this.panBitmapVersion===this.boardVersion;
        this.panLayer=document.createElement('div');this.panLayer.className='pan-layer';
        if(this.panUsingCanvas) {
            const canvas=document.createElement('canvas');
            canvas.width=this.panBitmap.width;canvas.height=this.panBitmap.height;
            canvas.style.width='100%';canvas.style.height='100%';
            this.panLayer.appendChild(canvas);this.panContext=canvas.getContext('2d');
        } else {
            // Immediate fallback while a new bitmap is being prepared: reuse existing cells.
            this.stage.classList.add('pan-live');this.panSeams=new Map();
        }
        this.stage.appendChild(this.panLayer);this.stage.classList.add('panning');
        this.paintPan(0,0);
    }
    paintPan(dx,dy) {
        const cs=this.vfx.cellSize,width=this.w*cs,height=this.h*cs;
        const wrap=(v,size)=>((v+size/2)%size+size)%size-size/2;
        const x=this.spec.wrapX?wrap(dx,width):0,y=this.spec.wrapY?wrap(dy,height):0;
        if(this.panUsingCanvas) {
            const ctx=this.panContext,dpr=this.panBitmap.width/width;
            const xs=this.spec.wrapX?[x,x+(x>0?-width:width)]:[0];
            const ys=this.spec.wrapY?[y,y+(y>0?-height:height)]:[0];
            ctx.clearRect(0,0,ctx.canvas.width,ctx.canvas.height);
            for(const oy of ys)for(const ox of xs)ctx.drawImage(this.panBitmap,ox*dpr,oy*dpr);
        } else {
            // Compatibility fallback: reuse the field, duplicating only cells split at the seam.
            const mod=(v,n)=>(v%n+n)%n;
            for(const row of this.cells)for(const c of row) {
                const left=c.x*cs+x,top=c.y*cs+y;
                const px=this.spec.wrapX?mod(left,width):left;
                const py=this.spec.wrapY?mod(top,height):top;
                c.el.style.transform=`translate(${px-c.x*cs}px,${py-c.y*cs}px)`;
                const seams=[];
                if(this.spec.wrapX && px+cs>width)seams.push([px-width,py]);
                if(this.spec.wrapY && py+cs>height)seams.push([px,py-height]);
                if(seams.length===2)seams.push([px-width,py-height]);
                let copies=this.panSeams.get(c);
                if(!copies){copies=[];this.panSeams.set(c,copies);}
                for(let i=0;i<3;i++) {
                    if(i<seams.length) {
                        if(!copies[i]) {
                            const clone=c.el.cloneNode(true);clone.style.position='absolute';clone.style.width=clone.style.height=cs+'px';
                            clone.style.left=clone.style.top='0';clone.style.gridColumn=clone.style.gridRow='auto';
                            clone.style.pointerEvents='none';this.el.appendChild(clone);copies[i]=clone;
                        }
                        copies[i].style.display='';copies[i].style.transform=`translate(${seams[i][0]}px,${seams[i][1]}px)`;
                    } else if(copies[i])copies[i].style.display='none';
                }
            }
        }
    }


    schedulePanBitmap() {
        this.boardVersion=(this.boardVersion||0)+1;
        if(!(this.spec.wrapX||this.spec.wrapY) || typeof Path2D==='undefined')return;
        const version=this.boardVersion,cs=this.vfx.cellSize,dpr=window.devicePixelRatio||1;
        if(cs<=0)return;
        const canvas=document.createElement('canvas');canvas.width=Math.round(this.w*cs*dpr);canvas.height=Math.round(this.h*cs*dpr);
        const ctx=canvas.getContext('2d');if(!ctx)return;
        ctx.scale(canvas.width/(this.w*cs),canvas.height/(this.h*cs));
        const cells=this.cells.flat();let index=0;
        const line=this.panGridColor || (this.panGridColor=getComputedStyle(document.documentElement).getPropertyValue('--grid-line').trim()||'rgba(190,224,198,.12)');
        const later=fn=>typeof requestIdleCallback==='function'?requestIdleCallback(fn,{timeout:250}):setTimeout(fn,32);
        const batch=(finish=false)=>{
            if(version!==this.boardVersion || index>=cells.length)return;
            if(!finish && (this.pan||this.panSettling)){later(()=>batch());return;}
            const start=performance.now();
            do {
                const c=cells[index++],x=c.x*cs,y=c.y*cs;
                ctx.save();ctx.translate(x,y);
                if(c.type===TILES.EMPTY) {
                    ctx.fillStyle='rgba(0,0,0,.24)';ctx.fillRect(0,0,cs,cs);
                    const shade=ctx.createLinearGradient(0,0,0,3);
                    shade.addColorStop(0,'#0004');shade.addColorStop(1,'#0000');
                    ctx.fillStyle=shade;ctx.fillRect(0,0,cs,3);
                } else {
                    ctx.fillStyle='rgba(166,220,181,.03)';ctx.fillRect(0,0,cs,cs);
                    ctx.strokeStyle=line;ctx.lineWidth=1;ctx.strokeRect(.5,.5,cs-1,cs-1);
                    ctx.translate(cs/2,cs/2);ctx.rotate(c.vRot*Math.PI/2);ctx.scale(cs/100,cs/100);ctx.translate(-50,-50);
                    this.paintTileSnapshot(ctx,c);
                }
                ctx.restore();
            } while(index<cells.length && (finish || performance.now()-start<5));
            if(index<cells.length)later(()=>batch());
            else {this.panBitmap=canvas;this.panBitmapVersion=version;this.finishPanBitmap=null;}
        };
        this.finishPanBitmap=()=>batch(true);
        later(()=>batch());
    }
    paintTileSnapshot(ctx,c) {
        // Cache geometry separately from state; no SVG parsing/rasterization during a swipe.
        if(!c.snapshotShapes) {
            const svg=c.el.querySelector('svg');if(!svg)return;
            c.snapshotShapes=[];
            const visit=(node,matrices)=>{
                const transform=node.transform?.baseVal?.consolidate()?.matrix;
                const transforms=transform?[...matrices,transform]:matrices;
                if(['svg','g'].includes(node.tagName.toLowerCase())) {
                    for(const child of node.children)visit(child,transforms);return;
                }
                const n=name=>Number(node.getAttribute(name)||0);let path;
                switch(node.tagName.toLowerCase()) {
                    case 'path':path=new Path2D(node.getAttribute('d'));break;
                    case 'rect': {
                        path=new Path2D();const x=n('x'),y=n('y'),w=n('width'),h=n('height'),r=n('rx');
                        path.moveTo(x+r,y);path.lineTo(x+w-r,y);path.quadraticCurveTo(x+w,y,x+w,y+r);
                        path.lineTo(x+w,y+h-r);path.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
                        path.lineTo(x+r,y+h);path.quadraticCurveTo(x,y+h,x,y+h-r);
                        path.lineTo(x,y+r);path.quadraticCurveTo(x,y,x+r,y);path.closePath();break;
                    }
                    case 'circle':path=new Path2D();path.arc(n('cx'),n('cy'),n('r'),0,Math.PI*2);break;
                    case 'line':path=new Path2D();path.moveTo(n('x1'),n('y1'));path.lineTo(n('x2'),n('y2'));break;
                    case 'polygon': {
                        path=new Path2D();const points=node.getAttribute('points').trim().split(/[ ,]+/).map(Number);
                        path.moveTo(points[0],points[1]);for(let i=2;i<points.length;i+=2)path.lineTo(points[i],points[i+1]);path.closePath();break;
                    }
                    default:return;
                }
                c.snapshotShapes.push({node,path,transforms});
            };
            visit(svg,[]);
        }
        this.snapshotStyleCache ??= new Map();
        const key=[c.type,c.color,c.visGroups,c.shortGroups,c.loopPorts,!!this.completed].join(':');
        let styles=this.snapshotStyleCache.get(key);
        if(!styles) {
            styles=c.snapshotShapes.map(({node})=>{
                const css=getComputedStyle(node),style={};
                for(const name of ['fill','stroke','strokeWidth','strokeLinecap','strokeLinejoin','opacity','fillOpacity','strokeOpacity'])style[name]=css[name];
                return style;
            });
            this.snapshotStyleCache.set(key,styles);
        }
        for(let i=0;i<c.snapshotShapes.length;i++) {
            const {path,transforms}=c.snapshotShapes[i],css=styles[i];ctx.save();
            for(const m of transforms)ctx.transform(m.a,m.b,m.c,m.d,m.e,m.f);
            ctx.lineWidth=parseFloat(css.strokeWidth)||0;ctx.lineCap=css.strokeLinecap;ctx.lineJoin=css.strokeLinejoin;
            if(css.fill!=='none') {ctx.fillStyle=css.fill;ctx.globalAlpha=(parseFloat(css.opacity)||0)*(parseFloat(css.fillOpacity)||0);ctx.fill(path);}
            if(css.stroke!=='none'&&ctx.lineWidth) {ctx.strokeStyle=css.stroke;ctx.globalAlpha=(parseFloat(css.opacity)||0)*(parseFloat(css.strokeOpacity)||0);ctx.stroke(path);}
            ctx.restore();
        }
    }

    settlePan(dx,dy) {
        const cs=this.vfx.cellSize;
        const sx=this.spec.wrapX ? Math.round(dx/cs) : 0;
        const sy=this.spec.wrapY ? Math.round(dy/cs) : 0;
        const start=performance.now();
        this.panSettling=true;
        const animate=now=>{
            const t=Math.min(1,(now-start)/180),ease=1-Math.pow(1-t,3);
            this.paintPan(dx+(sx*cs-dx)*ease,dy+(sy*cs-dy)*ease);
            if(t<1) this.panFrame=requestAnimationFrame(animate);
            else {
                this.shiftField(sx,sy);
                this.cancelPan();
                this.haptic('tick');
            }
        };
        this.panFrame=requestAnimationFrame(animate);
    }

    shiftField(sx,sy) {
        sx=this.spec.wrapX ? sx : 0; sy=this.spec.wrapY ? sy : 0;
        // Sync rotations before moving; write the final translated state only once.
        this.saveProgress(false);
        const mod=(v,n)=>(v%n+n)%n;
        const previous=this.map,oldCells=this.cells;
        this.map=Array.from({length:this.h},(_,y)=>Array.from({length:this.w},(_,x)=>
            previous[mod(y-sy,this.h)][mod(x-sx,this.w)]));
        this.cells=Array.from({length:this.h},(_,y)=>Array.from({length:this.w},(_,x)=>{
            const c=oldCells[mod(y-sy,this.h)][mod(x-sx,this.w)];
            c.x=x;c.y=y;c.el.style.gridColumn=String(x+1);c.el.style.gridRow=String(y+1);
            c.el.style.transform='';
            c.el.querySelectorAll('.wrap-edge').forEach(mark=>mark.remove());
            if(c.type!==TILES.EMPTY)for(const [enabled,dir,name] of [
                [this.spec.wrapY&&y===0,0,'top'],[this.spec.wrapX&&x===this.w-1,1,'right'],
                [this.spec.wrapY&&y===this.h-1,2,'bottom'],[this.spec.wrapX&&x===0,3,'left']]) {
                if(!enabled)continue;const mark=document.createElement('span');
                mark.className='wrap-edge '+name;mark.setAttribute('data-dir',String(dir));c.el.appendChild(mark);
            }
            return c;
        }));
        this.vfx.particles=[];
        this.check(true);
        this.saveProgress();
    }

    cancelPan() {
        cancelAnimationFrame(this.panFrame);
        cancelAnimationFrame(this.dragFrame);this.dragFrame=null;
        const p=this.pan;
        this.pan=null;
        if(p && this.stage.hasPointerCapture(p.id)) this.stage.releasePointerCapture(p.id);
        this.panLayer?.remove();this.panLayer=null;this.panContext=null;
        if(this.cells)for(const row of this.cells)for(const c of row)c.el.style.transform='';
        if(this.panSeams)for(const copies of this.panSeams.values())for(const clone of copies)clone.remove();
        this.panSeams=null;this.stage.classList.remove('pan-live');
        this.panSettling=false;
        this.stage.classList.remove('panning');
        if(this.resizePending) {
            this.resizePending=false;this.setupLayout();this.check(true);
        }
    }

    initResetHandler() {
        const header = document.getElementById('game-header-stats');
        let pressTimer;
        let isPressing = false;

        const startPress = (e) => {
            if (this.sandboxMode) return;
            if (e.type === 'mousedown' && e.button !== 0) return;
            isPressing = true;
            header.classList.add('reset-charging');
            pressTimer = setTimeout(() => {
                if (isPressing) {
                    isPressing = false;
                    header.classList.remove('reset-charging');
                    if (confirm("Reset game progress and start from Level 1?")) {
                        localStorage.removeItem(this.STORAGE_KEY);
                        window.location.reload();
                    }
                }
            }, 2000); 
        };

        const cancelPress = () => {
            isPressing = false;
            header.classList.remove('reset-charging');
            clearTimeout(pressTimer);
        };

        header.addEventListener('mousedown', startPress);
        header.addEventListener('touchstart', startPress);
        header.addEventListener('mouseup', cancelPress);
        header.addEventListener('mouseleave', cancelPress);
        header.addEventListener('touchend', cancelPress);
    }

    saveProgress(persist=true) {
        if (this.cells && this.map) {
            for(let y=0;y<this.h;y++){
                for(let x=0;x<this.w;x++){
                    this.map[y][x].rot = this.cells[y][x].vRot;
                }
            }
        }
        if(!persist || this.sandboxMode) return; // Sync rotations without writing intermediate or sandbox states.
        const data = { generation: GENERATION_VERSION, v: this.SAVE_VERSION, lvl: this.lvl, map: this.map, spec: this.spec };
        localStorage.setItem(this.STORAGE_KEY, JSON.stringify(data));
    }

    loadProgress() {
        try {
            const raw = localStorage.getItem(this.STORAGE_KEY);
            if (!raw) return false;
            const data = JSON.parse(raw);
            if(!Number.isSafeInteger(data.lvl) || data.lvl<1) return false;
            if (data.v !== this.SAVE_VERSION || data.generation!==GENERATION_VERSION) return false; 
            this.resetCompletion();
            this.lvl = data.lvl;
            this.spec = data.spec || {template:0, wrapX:false, wrapY:false, spacing:3};
            this.map = data.map; 
            this.h = this.map.length;
            this.w = this.map[0].length;
            this.setupLayout();
            document.getElementById('level-display').textContent=this.lvl;
            this.render();
            this.ov.classList.remove('visible');
            this.el.classList.remove('level-complete');
            this.check(true);
            return true;
        } catch (e) { return false; }
    }

    setupLayout() {
        document.documentElement.style.setProperty('--viewport-height',`${window.visualViewport?.height || window.innerHeight}px`);
        this.updateModeUI();
        const {availW,availH} = this.availableSpace();
        // Fractional cells let the complete board fit, even on small landscape screens.
        const cs = Math.floor(Math.min(availW / this.w, availH / this.h, 80)*100)/100;
        this.stage.style.touchAction = this.spec.wrapX || this.spec.wrapY ? 'none' : 'auto';
        this.stage.classList.toggle('pannable', this.spec.wrapX || this.spec.wrapY);
        this.stage.classList.toggle('wrap-x',this.spec.wrapX);
        this.stage.classList.toggle('wrap-y',this.spec.wrapY);
        document.documentElement.style.setProperty('--cell-base-size', `${cs}px`);
        const pxW = (this.w * cs) + 'px';
        const pxH = (this.h * cs) + 'px';
        this.stage.style.width = pxW;
        this.stage.style.height = pxH;
        this.el.style.gridTemplateColumns = `repeat(${this.w}, ${cs}px)`;
        this.el.style.gridTemplateRows = `repeat(${this.h}, ${cs}px)`;
        this.el.style.backgroundSize = `${cs}px ${cs}px`;
        this.gridLines.style.backgroundSize = `${cs}px ${cs}px`;
        this.vfx.resize(this.w*cs, this.h*cs, cs);
    }

    availableSpace() {
        const num=v=>parseFloat(v)||0;
        const body=getComputedStyle(document.body), frame=getComputedStyle(this.cnt);
        const wrapper=document.getElementById('game-wrapper');
        const width=wrapper.clientWidth || Math.min(1000,window.innerWidth-num(body.paddingLeft)-num(body.paddingRight));
        const height=wrapper.clientHeight || (window.visualViewport?.height || window.innerHeight)-num(body.paddingTop)-num(body.paddingBottom);
        const outerHeight=id=>{
            const el=document.getElementById(id);
            if(el.hidden) return 0;
            const css=getComputedStyle(el);
            return el.offsetHeight+num(css.marginTop)+num(css.marginBottom);
        };
        const controls=outerHeight('game-header-stats')+outerHeight('cheat-badge')+outerHeight('debug-btn')+outerHeight('overlay');
        const frameW=num(frame.paddingLeft)+num(frame.paddingRight)+num(frame.borderLeftWidth)+num(frame.borderRightWidth);
        const frameH=num(frame.paddingTop)+num(frame.paddingBottom)+num(frame.borderTopWidth)+num(frame.borderBottomWidth);
        return {availW:Math.max(0,width-frameW-2),availH:Math.max(0,height-controls-frameH-2)};
    }
    start() {
        this.cancelPan();
        this.resetCompletion();
        this.el.classList.remove('no-pop');
        clearTimeout(this.winTimer);
        ({spec:this.spec,w:this.w,h:this.h}=selectLevelLayout(this.lvl));
        const active=fieldMask(this.w,this.h,this.spec).flat().filter(Boolean).length;
        const nb=batteryCount(this.lvl,active);
        this.inputLocked = false;
        this.setupLayout();
        document.getElementById('level-display').textContent=this.lvl;
        this.map = this.gen.generate(this.w, this.h, nb, this.lvl, this.spec);
        this.render();
        this.ov.classList.remove('visible');
        this.el.classList.remove('level-complete');
        this.saveProgress(); 
        this.check(true);
    }
    
    resolve() {
        if(this.transitionBusy) return;
        this.audio.init();
        this.cancelPan();
        this.cells.forEach(row => row.forEach(c => {
            c.vRot = c.correctRot;
            c.inEl.style.transform = `rotate(${c.vRot * 90}deg)`;
        }));
        this.check(false);
    }
    
    render() {
        this.el.innerHTML='';
        this.paintState=new Map();
        this.cells=[];
        const fragment=document.createDocumentFragment();
        for(let y=0;y<this.h;y++){
            let r=[];
            for(let x=0;x<this.w;x++){
                let d=this.map[y][x];
                let cel=document.createElement('div'); cel.className='cell';
                if(d.type===TILES.EMPTY) cel.classList.add('void');
                else {
                    cel.classList.add('active-cell');
                    const edges=[];
                    if(this.spec.wrapX && x===0) edges.push('left');
                    if(this.spec.wrapX && x===this.w-1) edges.push('right');
                    if(this.spec.wrapY && y===0) edges.push('top');
                    if(this.spec.wrapY && y===this.h-1) edges.push('bottom');
                    edges.forEach(edge=>{const mark=document.createElement('span');mark.className='wrap-edge '+edge;mark.setAttribute('data-dir',String(['top','right','bottom','left'].indexOf(edge)));cel.appendChild(mark);});
                }
                let inn=document.createElement('div'); inn.className='tile-inner';
                
                if (d.type === TILES.CORNER) cel.classList.add('corner');
                else if (d.type === TILES.BRIDGE) cel.classList.add('bridge');
                else if (d.type === TILES.D_CORNER) cel.classList.add('dcorner');
                else if (d.type === TILES.BULB) cel.classList.add('bulb');
                
                inn.innerHTML=this.svg(d); inn.style.transform=`rotate(${d.rot*90}deg)`;
                cel.appendChild(inn);
                cel.style.gridColumn=String(x+1);cel.style.gridRow=String(y+1);
                fragment.appendChild(cel);
                let obj={ x,y,type:d.type, vRot:d.rot, correctRot:d.correctRot, el:cel,inEl:inn, color:displayBulbColor(d.color) };
                cel.onclick=(e)=>this.rot(obj, e);
                r.push(obj);
            }
            this.cells.push(r);
        }
        this.el.appendChild(fragment);
    }
    svg(d) {
        const t=d.type, c=TILE_CONNS[t];
        let bg = '', fg = '';
        const addPath = (dAttr, grp, dir, cap) => {
            const capClass = cap ? 'cap-butt' : '';
            bg += `<path d="${dAttr}" class="wire-bg ${capClass}" />`;
            fg += `<path d="${dAttr}" class="wire-path wire-group-${grp} wire-${dir} ${capClass}" />`;
        };

        if(t===TILES.BRIDGE) {
            // Vertical (Group 0): 0 -> 2
            bg += `<path d="M 50 -2 L 50 102" class="wire-bg cap-butt" />`;
            fg += `<path d="M 50 -2 L 50 102" class="wire-path wire-group-0 wire-0 wire-2 cap-butt" />`;

            // Horizontal (Group 1): 3 -> 1
            const hopPath = "M -2 50 L 30 50 C 30 15 70 15 70 50 L 102 50";
            fg += `<path d="${hopPath}" class="wire-bg cap-butt" />`;
            fg += `<path d="${hopPath}" class="wire-path wire-group-1 wire-3 wire-1 cap-butt" />`;
        } 
        else if(t===TILES.D_CORNER) {
            // Top-Left (3->0)
            bg += `<path d="M -2 50 Q 50 50 50 -2" class="wire-bg cap-butt" />`;
            fg += `<path d="M -2 50 Q 50 50 50 -2" class="wire-path wire-group-0 wire-3 wire-0 cap-butt" />`;
            
            // Bot-Right (2->1)
            bg += `<path d="M 50 102 Q 50 50 102 50" class="wire-bg cap-butt" />`;
            fg += `<path d="M 50 102 Q 50 50 102 50" class="wire-path wire-group-1 wire-2 wire-1 cap-butt" />`;
        }
        else if(t===TILES.CORNER) {
            let p1=-1, p2=-1;
            for(let i=0; i<4; i++) if(c[i]) { if(p1===-1) p1=i; else p2=i; }
            const R = 20; const C = 50; let dStr = "";
            
            if (p1===0 && p2===1) dStr = `M 50 -2 L 50 ${C-R} Q 50 50 ${C+R} 50 L 102 50`; // 0->1
            else if (p1===1 && p2===2) dStr = `M 102 50 L ${C+R} 50 Q 50 50 50 ${C+R} L 50 102`; // 1->2
            else if (p1===2 && p2===3) dStr = `M 50 102 L 50 ${C+R} Q 50 50 ${C-R} 50 L -2 50`; // 2->3
            else if (p1===0 && p2===3) dStr = `M -2 50 L ${C-R} 50 Q 50 50 50 ${C-R} L 50 -2`; // 3->0

            bg += `<path d="${dStr}" class="wire-bg cap-butt" />`;
            fg += `<path d="${dStr}" class="wire-path wire-group-0 wire-${p1} wire-${p2} cap-butt" />`;
        }
        else if(t===TILES.BATTERY) {
            fg += `<rect x="32" y="20" width="36" height="60" rx="3" class="bat-case" />
                   <rect x="42" y="14" width="16" height="6" rx="1" class="bat-tip" />
                   <polygon points="55,35 42,50 50,50 45,65 58,50 50,50" class="bat-icon" />`;
            addPath("M 50 14 L 50 -2", 0, "0", true);
        } 
        else if(t===TILES.BULB) {
            // Draw Center -> Edge (75 -> 102)
            // This connects to Pin 2
            addPath("M 50 75 L 50 102", 0, "2", true);
            fg += `<g transform="translate(12.5, 7.5) scale(0.75)" style="--bulb-color: ${displayBulbColor(d.color)}">
                    <path d="M 45 75 L 45 55 L 50 45 L 55 55 L 55 75" class="bulb-filament" />
                    <path d="M 40 75 Q 15 75 15 45 A 20 20 0 1 1 85 45 Q 85 75 60 75 Z" class="bulb-glass" />
                    <rect x="38" y="75" width="24" height="16" rx="2" class="bulb-cap" />
                    <line x1="38" y1="80" x2="62" y2="80" class="bulb-thread" />
                    <line x1="38" y1="86" x2="62" y2="86" class="bulb-thread" />
                    <path d="M 44 91 L 56 91 L 50 96 Z" fill="#555" />
                   </g>`;
        }
        else {
            // Hubs: Always Center -> Edge
            if(c[0]) addPath("M 50 50 L 50 -2", 0, "0", true);
            if(c[1]) addPath("M 50 50 L 102 50", 0, "1", true);
            if(c[2]) addPath("M 50 50 L 50 102", 0, "2", true);
            if(c[3]) addPath("M 50 50 L -2 50", 0, "3", true);
            
            if(t!==TILES.EMPTY && t!==TILES.LINE) {
                bg += `<circle cx="50" cy="50" r="7" class="wire-bg" fill="none" stroke-width="18"/>`;
                fg += `<circle cx="50" cy="50" r="7" class="wire-path wire-group-0" fill="currentColor" stroke="none"/>`;
            }
        }
        return `<svg viewBox="0 0 100 100" width="100%" height="100%">${bg}${fg}</svg>`;
    }
    rot(c, e) {
        if(this.transitionBusy || this.inputLocked || this.pan || this.panSettling || performance.now() < (this.suppressClickUntil || 0) || c.type===TILES.EMPTY || this.ov.classList.contains('visible')) return;
        this.audio.init(); this.audio.play('rotate');
        c.vRot++; c.inEl.style.transform=`rotate(${c.vRot*90}deg)`;
        const cx = c.x * this.vfx.cellSize + this.vfx.cellSize/2;
        const cy = c.y * this.vfx.cellSize + this.vfx.cellSize/2;
        this.vfx.spawn(cx,cy,'spark',c.type===TILES.BULB ? c.color : undefined);
        c.el.classList.remove('tapped');void c.el.offsetWidth;c.el.classList.add('tapped');
        this.haptic('tick');
        this.saveProgress(); 
        this.check(false);
    }
    haptic(type) {
        if(!navigator.vibrate) return;
        if(type==='tick') navigator.vibrate(10);
        else if(type==='zap') navigator.vibrate([20, 20, 20]);
        else if(type==='win') navigator.vibrate([30, 50, 30, 50, 100]);
    }
    getLocalGroup(type, lp) {
        if (!TILE_CONNS[type][lp]) return -1;
        if (type === TILES.BRIDGE) return (lp % 2 === 0) ? 0 : 1; 
        if (type === TILES.D_CORNER) return (lp===0 || lp===3) ? 0 : 1; 
        return 0;
    }
    getGlobalGroup(type, rot, globalDir) {
        let lp = (globalDir - rot + 400) % 4;
        return this.getLocalGroup(type, lp);
    }
    wireNode(c,selector) {
        c.wireCache ??= new Map();
        if(!c.wireCache.has(selector)) c.wireCache.set(selector,c.el.querySelector(selector));
        return c.wireCache.get(selector);
    }
    highlightPoweredLoops(paint=(node,name)=>node.classList.add(name)) {
        // Each electrically independent group is a vertex. An edge belongs to a
        // cycle exactly when it is not a graph bridge; this excludes attached branches
        // and even a connector between two separate loops.
        const vertices=new Map(),edges=[];
        const vertex=(c,g)=>{
            const id=(c.y*this.w+c.x)*2+g;
            if(!vertices.has(id)) vertices.set(id,{id,edges:[],time:0,low:0});
            return vertices.get(id);
        };
        for(const row of this.cells) for(const c of row) {
            c.loopPorts=0;
            for(const d of [1,2]) {
                const group=this.getGlobalGroup(c.type,c.vRot,d);
                if(group<0 || !(c.visGroups&(1<<group))) continue;
                const p=neighbor(c.x,c.y,d,this.w,this.h,this.spec);
                const other=this.cells[p.y]?.[p.x];
                if(!other) continue;
                const opposite=(d+2)%4;
                const otherGroup=this.getGlobalGroup(other.type,other.vRot,opposite);
                if(otherGroup<0 || !(other.visGroups&(1<<otherGroup))) continue;
                const a=vertex(c,group),b=vertex(other,otherGroup);
                const edge={id:edges.length,a,b,bridge:false,ends:[
                    {c,group,port:((d-c.vRot)%4+4)%4},
                    {c:other,group:otherGroup,port:((opposite-other.vRot)%4+4)%4}
                ]};
                edges.push(edge);a.edges.push(edge);b.edges.push(edge);
            }
        }
        let time=0;
        const visit=(v,parentEdge)=>{
            v.time=v.low=++time;
            for(const e of v.edges) {
                if(e.id===parentEdge) continue;
                const next=e.a===v ? e.b : e.a;
                if(!next.time) {
                    visit(next,e.id);v.low=Math.min(v.low,next.low);
                    if(next.low>v.time) e.bridge=true;
                } else v.low=Math.min(v.low,next.time);
            }
        };
        for(const v of vertices.values()) if(!v.time) visit(v,-1);
        for(const e of edges) if(!e.bridge) for(const {c,group,port} of e.ends) {
            c.loopPorts|=1<<port;
            c.cycleCache ??= new Map();
            const key=group*4+port;
            if(!c.cycleCache.has(key)) c.cycleCache.set(key,Array.from(c.el.querySelectorAll(`.wire-group-${group}.wire-${port}`)));
            c.cycleCache.get(key).forEach(path=>paint(path,'cycle-wire'));
        }
    }
    check(silent) {
        let bulbs=0, lit=0, short=false;
        let litBulbsArr = []; 
        const desired=new Map();
        const paint=(node,name)=>{
            if(!desired.has(node)) desired.set(node,new Set());
            desired.get(node).add(name);
        };
        this.cells.forEach(r=>r.forEach(c=>{
            c.visGroups=0;c.shortGroups=0;c.par=null;
            if(c.type===TILES.BULB) bulbs++;
        }));
        let q = [];
        for(let y=0;y<this.h;y++) for(let x=0;x<this.w;x++) {
            let c = this.cells[y][x];
            if(c.type === TILES.BATTERY) {
                c.visGroups |= 1; paint(c.el,'pg-0');
                q.push({c: c, dist: 0});
            }
        }
        let queueHead=0;
        while(queueHead < q.length) {
            let {c, dist} = q[queueHead++];
            let groups = [];
            if(c.visGroups & 1) groups.push(0);
            if(c.visGroups & 2) groups.push(1);
            groups.forEach(grp => {
                for(let lp=0; lp<4; lp++) {
                    if(this.getLocalGroup(c.type, lp) === grp) {
                        let globalDir = (lp + c.vRot) % 4;
                        let {x:nx,y:ny} = neighbor(c.x,c.y,globalDir,this.w,this.h,this.spec);
                        if(nx>=0 && nx<this.w && ny>=0 && ny<this.h) {
                            let nextC = this.cells[ny][nx];
                            let entryDir = (globalDir + 2) % 4;
                            let nextGrp = this.getGlobalGroup(nextC.type, nextC.vRot, entryDir);
                            if(nextGrp !== -1) {
                                if(!(nextC.visGroups & (1 << nextGrp))) {
                                    nextC.visGroups |= (1 << nextGrp);
                                    paint(nextC.el,'pg-'+nextGrp);
                                    let localEntry = (entryDir - nextC.vRot + 400) % 4;
                                    paint(nextC.el,`in-g${nextGrp}-${localEntry}`);
                                    
                                    // === LOGIC FIX: DIRECT JS REVERSAL ===
                                    // Instead of complex CSS rules, we directly apply 'reverse-flow' class
                                    // to the specific wire-path element if the flow opposes drawing direction.
                                    
                                    const t = nextC.type;
                                    const le = localEntry; 
                                    let needRev = false;
                                    let targetWire = null;

                                    if (t === TILES.BRIDGE) {
                                        // Vert (Group 0): 0->2. Entry 2 is Reverse.
                                        if (nextGrp===0 && le===2) needRev=true;
                                        // Horz (Group 1): 3->1. Entry 1 is Reverse.
                                        if (nextGrp===1 && le===1) needRev=true;
                                        // Target specific wire group
                                        targetWire = this.wireNode(nextC,`.wire-group-${nextGrp}`);
                                    } 
                                    else if (t === TILES.D_CORNER) {
                                        // G0: 3->0. Entry 0 is Rev.
                                        if (nextGrp===0 && le===0) needRev=true;
                                        // G1: 2->1. Entry 1 is Rev.
                                        if (nextGrp===1 && le===1) needRev=true;
                                        targetWire = this.wireNode(nextC,`.wire-group-${nextGrp}`);
                                    }
                                    else if (t === TILES.CORNER) {
                                        // 0->1, 1->2, 2->3, 3->0
                                        // If entry is at 'end' of segment, Rev.
                                        // Get P1, P2 (ordered for 0,1 1,2 2,3 but special 3,0)
                                        let p1=-1, p2=-1;
                                        for(let i=0; i<4; i++) if(TILE_CONNS[t][i]) { if(p1===-1) p1=i; else p2=i; }
                                        
                                        if (p1===0 && p2===3) { if(le===0) needRev=true; } // 3->0
                                        else { if(le===p2) needRev=true; } // p1->p2
                                        targetWire = this.wireNode(nextC,`.wire-group-0`);
                                    }
                                    else if (t === TILES.BULB) {
                                        // Center->2. Entry is 2. Always Rev.
                                        needRev = true; 
                                        targetWire = this.wireNode(nextC,`.wire-group-0`);
                                    }
                                    else {
                                        // Hubs (Line, Tee, Cross)
                                        // Center -> Out. Entry is at Out. Always Rev on THAT wire.
                                        // But hub has multiple wires. We need to find the specific one connected to 'le'.
                                        targetWire = this.wireNode(nextC,`.wire-group-0.wire-${le}`);
                                        if (targetWire) needRev = true;
                                    }

                                    if (needRev && targetWire) {
                                        paint(targetWire,'reverse-flow');
                                    }

                                    if(nextC.type===TILES.BULB) { lit++; litBulbsArr.push(nextC); }
                                    q.push({c: nextC, dist: dist+1});
                                }
                            }
                        }
                    }
                }
            });
        }
        let visitedSC = new Set();
        for(let y=0;y<this.h;y++) for(let x=0;x<this.w;x++) {
            let start = this.cells[y][x];
            [0, 1].forEach(g => {
                if((start.visGroups & (1<<g)) && !visitedSC.has(`${x},${y},${g}`)) {
                    let qS = [{c: start, grp: g}];
                    visitedSC.add(`${x},${y},${g}`);
                    let batsFound = 0;
                    let pathCells = [];
                    if(start.type === TILES.BATTERY) batsFound++;
                    let head = 0;
                    while(head < qS.length) {
                        let {c: curr, grp: cGrp} = qS[head++];
                        pathCells.push({c: curr, grp: cGrp});
                        for(let lp=0; lp<4; lp++) {
                            if(this.getLocalGroup(curr.type, lp) === cGrp) {
                                let globalDir = (lp + curr.vRot) % 4;
                                let {x:nx,y:ny} = neighbor(curr.x,curr.y,globalDir,this.w,this.h,this.spec);
                                if(nx>=0 && nx<this.w && ny>=0 && ny<this.h) {
                                    let next = this.cells[ny][nx];
                                    let entryDir = (globalDir + 2) % 4;
                                    let nGrp = this.getGlobalGroup(next.type, next.vRot, entryDir);
                                    if(nGrp !== -1 && (next.visGroups & (1<<nGrp))) {
                                        let key = `${nx},${ny},${nGrp}`;
                                        if(!visitedSC.has(key)) {
                                            visitedSC.add(key);
                                            if(next.type === TILES.BATTERY) batsFound++;
                                            qS.push({c: next, grp: nGrp});
                                        }
                                    }
                                }
                            }
                        }
                    }
                    if(batsFound > 1) {
                        short = true;
                        pathCells.forEach(item => {
                            item.c.shortGroups|=1<<item.grp;
                            paint(item.c.el,'sc-' + item.grp);
                            if(!silent && !this.pan && !this.panSettling && Math.random()>0.7)
                                this.vfx.spawn((item.c.x+.5)*this.vfx.cellSize,(item.c.y+.5)*this.vfx.cellSize,'zap','#e74c3c');
                        });
                    }
                }
            });
        }
        this.cells.forEach(row=>row.forEach(c=>{
            c.el.querySelectorAll('.wrap-edge').forEach(mark=>{
                const d=Number(mark.getAttribute('data-dir'));
                const p=neighbor(c.x,c.y,d,this.w,this.h,this.spec);
                const other=this.cells[p.y]?.[p.x];
                const otherGroup=other ? this.getGlobalGroup(other.type,other.vRot,(d+2)%4) : -1;
                // A hint about the opposite contact, even before this cell is connected.
                const on=otherGroup>=0 && (other.visGroups&(1<<otherGroup)) &&
                    !(other.shortGroups&(1<<otherGroup));
                if(on) paint(mark,'edge-powered');
            });
        }));
        this.highlightPoweredLoops(paint);
        // Commit only changed classes; unchanged animations keep running untouched.
        const previous=this.paintState || new Map();
        for(const [node,names] of previous) for(const name of names)
            if(!desired.get(node)?.has(name)) node.classList.remove(name);
        for(const [node,names] of desired) for(const name of names)
            if(!previous.get(node)?.has(name)) node.classList.add(name);
        this.paintState=desired;
        this.vfx.updateLight(litBulbsArr);
        this.schedulePanBitmap();
        if(!silent){
            if(short && !this.short) {
                this.audio.play('zap'); this.haptic('zap');
                this.cnt.classList.remove('shaking','fault-flash'); void this.cnt.offsetWidth; this.cnt.classList.add('shaking','fault-flash');
            }
            if(lit>this.prevLit) this.audio.play('on'); else if(lit<this.prevLit) this.audio.play('off');
        }
        this.short=short; this.prevLit=lit;
        
        const solved=lit===bulbs && bulbs>0 && !short;
        if(solved && !this.completed) {
            this.completed=true;
            this.inputLocked=true;
            this.el.classList.add('level-complete');
            this.stage.classList.add('level-complete');
            this.showCompletionMark();
            if(!silent) {this.audio.play('win');this.haptic('win');}
            this.ov.classList.add('visible');
        } else if(!solved && this.completed) {
            this.resetCompletion();
        }
    }
    showCompletionMark() {
        const title=document.getElementById('level-title');
        const mark=document.getElementById('level-complete-mark');
        title.classList.add('completed');mark.classList.add('visible');
        mark.setAttribute('aria-hidden','false');
        // Explicit keyframes also work when completion is restored during the first paint.
        if(typeof title.animate==='function' && !window.matchMedia?.('(prefers-reduced-motion: reduce)').matches) {
            const options={duration:1000,easing:'ease-in-out'};
            this.titleMotion=title.animate([{transform:'translateX(0)'},{transform:'translateX(calc(-.5em - 4px))'}],options);
            this.markMotion=mark.animate([{opacity:0},{opacity:1}],options);
            this.buttonMotion=this.ov.animate([{opacity:0,transform:'translateY(5px)'},{opacity:1,transform:'translateY(0)'}],options);
        }
    }
    resetCompletion() {
        this.titleMotion?.cancel();this.markMotion?.cancel();this.buttonMotion?.cancel();
        const title=document.getElementById('level-title');
        const mark=document.getElementById('level-complete-mark');
        title.style.transition='none';mark.style.transition='none';
        title.classList.remove('completed');mark.classList.remove('visible');
        void title.offsetWidth;
        title.style.transition='';mark.style.transition='';
        clearTimeout(this.winTimer);
        this.completed=false;this.inputLocked=false;
        this.el.classList.remove('level-complete');
        this.stage.classList.remove('level-complete');
        this.ov.classList.remove('visible');
        document.getElementById('level-complete-mark').classList.remove('visible');
        document.getElementById('level-complete-mark').setAttribute('aria-hidden','true');
    }

    transitionLevel(action) {
        if(this.transitionBusy) return;
        if(typeof this.cnt.animate!=='function' || window.matchMedia?.('(prefers-reduced-motion: reduce)').matches) {
            action();return;
        }
        this.cancelPan();this.transitionBusy=true;
        const fade=this.cnt.animate([{opacity:1},{opacity:0}],{duration:400,fill:'forwards',easing:'ease-in'});
        return fade.finished.catch(()=>{}).then(()=>{
            action();fade.cancel();
            const appear=this.cnt.animate([{opacity:0},{opacity:1}],{duration:600,easing:'ease-out'});
            return appear.finished.catch(()=>{});
        }).finally(()=>{fade.cancel();this.transitionBusy=false;});
    }
    exitSandbox() {
        if(!this.sandboxMode) return;
        return this.transitionLevel(()=>this.leaveSandbox());
    }
    leaveSandbox() {
        this.cancelPan();clearTimeout(this.winTimer);
        this.debugMode=false;this.cheatMode=false;
        const url=new URL(window.location.href);
        url.searchParams.delete('level');url.searchParams.delete('debug');
        window.history.replaceState(null,'',url.href);
        if(!this.loadProgress()) {this.lvl=1;this.start();}
    }
    nextLevel() {
        if(this.cheatMode && !this.debugMode) return this.exitSandbox();
        return this.transitionLevel(()=>{
            this.lvl=Math.min(Number.MAX_SAFE_INTEGER,this.lvl+1);
            this.start();
        }); 
    }
}
window.game = new Game();
</script>
